name: Node.js CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Verify build output
        run: test -f dist/index.html

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-build
          path: dist/
          if-no-files-found: error

      # 1. Decode SSH key
      - name: Decode SSH key
        env:
          SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY_B64" | base64 -d > ~/.ssh/ec2-key
          chmod 600 ~/.ssh/ec2-key

      # 2. Copy files to EC2
      - name: Copy files to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/ec2-key \
            -o StrictHostKeyChecking=accept-new \
            "$EC2_USER@$EC2_HOST" \
            "mkdir -p ~/nodeapp"

          rsync -avz \
            -e "ssh -i ~/.ssh/ec2-key -o StrictHostKeyChecking=accept-new" \
            --exclude '.git' \
            --exclude 'node_modules' \
            ./ "$EC2_USER@$EC2_HOST:~/nodeapp/"

      # 3. Start application on EC2
      - name: Start application on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/ec2-key \
            -o StrictHostKeyChecking=accept-new \
            "$EC2_USER@$EC2_HOST" << 'EOF'
          set -e
          cd ~/nodeapp
          npm install --omit=dev
          pm2 delete nodeapp || true
          pm2 start index.js --name nodeapp
          pm2 save
          EOF
